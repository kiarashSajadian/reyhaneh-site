<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Reyhaneh Jafari</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <script>
    try {
      var saved = localStorage.getItem('theme');
      document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
    } catch (e) {
      document.documentElement.dataset.theme = 'dark';
    }
  </script>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/component-tokens.css">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main>
    <section class="page-stub">
      <h1 class="page-stub__title">Page not found</h1>
      <p class="page-stub__text">This page does not exist or has moved.</p>
      <a href="/" style="color:inherit;text-decoration:underline;text-underline-offset:0.25em;font-size:1.125rem">Back to the homepage</a>
    </section>
  </main>
</body>
</html>
